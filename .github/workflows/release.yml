name: Release gate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  platform-validation:
    name: Validate on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require release commit on the default branch
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build:css
      - run: npm test
      - run: npm run smoke:package

  evidence-gate:
    name: Release evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: platform-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract exact-commit evidence from the annotated tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/extract-release-tag-evidence.js --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - name: Validate release evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/validate-release-evidence.js --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
